version: "2"

linters:
  enable:
    - errcheck
    - govet
    - ineffassign
    - staticcheck
    - unused
    - bodyclose
    - errorlint
    - misspell
    - nilerr
    - unconvert
    - copyloopvar
    - durationcheck
    - makezero
    - prealloc

  settings:
    errcheck:
      # Parser.Write on a bytes buffer cannot fail; requiring a check there
      # adds noise without adding safety.
      exclude-functions:
        - (*github.com/dscsystems/go-dnp3/internal/link.Parser).Write
    staticcheck:
      checks:
        - all
    misspell:
      # No locale. The prose here is British and the protocol vocabulary is
      # not: IEEE 1815 spells it "Time Synchronized" and lipgloss spells it
      # "Color", so neither locale can be enforced without demanding a rename
      # of a spec term or a third-party API. Unset, misspell still catches
      # genuine typos and stays out of the spelling argument.

  exclusions:
    rules:
      # Test helpers legitimately ignore errors on inputs they constructed.
      - path: _test\.go
        linters:
          - errcheck
          - prealloc

formatters:
  enable:
    - gofmt

issues:
  max-issues-per-linter: 0
  max-same-issues: 0
