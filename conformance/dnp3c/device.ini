################################################################################
# go-dnp3's device under test (dut/), as dnp3c sees it.
#
# This file and dut/device.go describe the same device and have to agree: the
# addresses, point counts, classes, timeouts and output roles below are the
# ones the DUT is built with. Every option not given here has dnp3c's default
# (`dnp3c -write` lists them all).
#
# It is written for 3.1r1 at subset level 3. run.sh appends
# "outstation.subset.level = 2" for 2.7, which tests only level 2; the later
# value wins.
################################################################################

test.output.directory = ./results
test.deviceUnderTest = go-dnp3 outstation (conformance/dnp3c/dut)

outstation.subset.level = 3

tcp.device.address = 127.0.0.1
tcp.device.port = 20000

link.source = 1
link.destination = 1024
link.num.retry = 3
link.timeout.ms = 1000

outstation.select.timeout.ms = 2000
outstation.response.timeout.ms = 2000
outstation.app.confirm.timeout.ms = 2000
outstation.fragmentSize = 2048

################################################################################
# Binary outputs: 20, of which 2 to 9 accept only the codes their roles name
# and the rest accept every code (dut/device.go, crobCodes).
################################################################################

binaryOutput.installedPoints = 0 ... 19
binaryOutput.maxPointsInSingleRequest = 4

binaryOutput.primary.valid.index = 0
binaryOutput.primary.valid.function = 0x03
binaryOutput.alternate.valid.index = 1
binaryOutput.alternate.valid.function = 0x81

binaryOutput.latchOnOffPoint.index = 2
binaryOutput.pulseOnOffPoint.index = 3
binaryOutput.latchAndPulsePoint.index = 4
binaryOutput.singleFunctionPulseOnPoint.index = 5
binaryOutput.singleFunctionLatchOnPoint.index = 6
binaryOutput.singleFunctionLatchOffPoint.index = 7
binaryOutput.singleFunctionPulseOnClosePoint.index = 8
binaryOutput.singleFunctionPulseOnTripPoint.index = 9

flag.tests.individualRemoteSupervisoryOutputIndex = 0
# an output that accepts output 0's command (0x03) and stays remote
flag.tests.individualRemoteSupervisoryRemoteOutputIndex = 10

################################################################################
# Analog outputs: 20, every one taking every variation of g41.
################################################################################

analogOutput.installedPoints = 0 ... 19
analogOutput.maxPointsInSingleRequest = 4
analogOutput.commands32Bit = true
analogOutput.index32Bit = 10
analogOutput.primary.valid.index = 0
analogOutput.primary.valid.value = 10
analogOutput.alternate.valid.index = 1
analogOutput.alternate.valid.value = 20

################################################################################
# Inputs: 20 of each type. Classes as dut/device.go's eventClass.
################################################################################

class.numClass1EventsGenerated = 3
class.numClass2EventsGenerated = 3
class.numClass3EventsGenerated = 3

binaryInput.eventsClass = 1
binaryInput.numEventsGenerated = 3
binaryInput.defaultEventVariation = 2

doubleBitInput.eventsClass = 1
doubleBitInput.numEventsGenerated = 3
doubleBitInput.defaultEventVariation = 2

counter.eventsClass = 2
counter.numEventsGenerated = 3

analogInput.eventsClass = 3
analogInput.valueReturn.index = 0
# every analog input has a deadband of 0: any change is an event
analogInput.valueReturn.deadband = 1

# the class of the binary inputs before 3.1r1's 8.26 assigns them; the
# generators change only 0 to 15, so binary input events are class 1
class.assign.class1BinaryInputs = 0 ... 15
class.assign.class2BinaryInputs = 16, 17
class.assign.class3BinaryInputs = 18, 19

# go-dnp3 has one event buffer for every type: each type can fill it alone
event.buffer.maxBinaryInputEvents = 1000
event.buffer.maxAnalogInputEvents = 1000
event.buffer.maxCounterEvents = 1000
event.buffer.maxDoubleBitInputEvents = 1000

################################################################################
# Time
################################################################################

timesync.supportSynchronizingTimeFromMaster = true
timesync.supportLanTimeSync = true
timesync.binaryInputChangeWithTime = true
timesync.binaryInputChangeWithRelativeTime = true
timesync.doubleBitInputChangeWithTime = true
timesync.doubleBitInputChangeWithRelativeTime = true
# NEED_TIME is asserted from the start, and again 10 s after each time the
# master sets the clock; 2 s after that the clock is unsynchronized
# (dut/device.go's syncInterval and clockHoldover). dnp3c counts the time to
# unsynchronized from the clock write, so it is the two together.
timesync.maxTimeFromResetToIIN14Ms = 0
timesync.maxTimeBetweenSyncRequestsMs = 10000
timesync.timeToUnsynchronizedMs = 12000

################################################################################
# Unsolicited responses
################################################################################

unsolicited.unsolicitedConfirmTimeoutMs = 2000
unsolicited.otherMasterAddress = 2
unsolicited.hasMinNumEventsBeforeUnsolicited = false
unsolicited.holdOffMs = 0
unsolicited.retryLimitConfigurable = true
unsolicited.retryLimit = 5

################################################################################
# Device attributes, as dut/device.go's configuredAttributes and the counts
# and fragment sizes the outstation derives
################################################################################

attributes.supportedVariations = 221, 224, 229, 233, 236, 239, 240, 241, 242, 243, 245, 247, 248, 250, 252
attributes.writableVariations = 245, 247

################################################################################
# Features
################################################################################

supports.selfAddress = true
supports.dataLinkConfirmRequests = true
supports.dataLinkRetries = true
supports.globalRemoteSupervisoryControl = true
supports.individualRemoteSupervisoryControl = true
supports.unsolicitedResponse = true
supports.deviceAttributes = true
supports.rangeReads = true
supports.multiFragmentResponses = true
# the outstation's fragment size is fixed for the life of a session, and
# 8.9's steps change it on a connection that stays open
supports.configurableFragmentSize = false
supports.binaryOutputChangeEvents = false
supports.binaryOutputCommandEvents = false
supports.analogOutputChangeEvents = false
supports.analogOutputCommandEvents = false

