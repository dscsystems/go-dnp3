name: Conformance

# dnp3c's IED certification procedures against our outstation. A full run
# waits out the timeouts the procedures test, so it runs weekly and on demand
# rather than on every change.
on:
  schedule:
    - cron: "23 5 * * 1"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  dnp3c:
    name: dnp3c ${{ matrix.revision }}
    runs-on: ubuntu-latest
    timeout-minutes: 120
    strategy:
      fail-fast: false
      matrix:
        revision: ["2.7", "3.1r1"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.26'
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: maven
      - name: Run the procedures
        env:
          KEEP_GOING: "1"
        run: ./conformance/dnp3c/run.sh ${{ matrix.revision }}
      - name: Upload the report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: dnp3c-${{ matrix.revision }}
          path: conformance/dnp3c/results
