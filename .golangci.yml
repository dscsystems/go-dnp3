version: "2"

linters:
  enable:
    - errcheck
    - govet
    - ineffassign
    - staticcheck
    - unused
    - bodyclose
    - errorlint
    - misspell
    - nilerr
    - unconvert
    - copyloopvar
    - durationcheck
    - makezero
    - prealloc

  settings:
    errcheck:
      # Parser.Write on a bytes buffer cannot fail; requiring a check there
      # adds noise without adding safety.
      exclude-functions:
        - (*github.com/dscsystems/go-dnp3/internal/link.Parser).Write
    staticcheck:
      checks:
        - all
    misspell:
      locale: US

  exclusions:
    rules:
      # Test helpers legitimately ignore errors on inputs they constructed.
      - path: _test\.go
        linters:
          - errcheck
          - prealloc

formatters:
  enable:
    - gofmt

issues:
  max-issues-per-linter: 0
  max-same-issues: 0
